limit_req_zone $binary_remote_addr zone=rag_login:10m rate=5r/m;

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /api/v1/auth/login {
        limit_req zone=rag_login burst=5 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/rag-api-proxy-common.conf;
    }

    location /api/ {
        include /etc/nginx/snippets/rag-api-proxy-common.conf;
    }

    location = /mcp {
        include /etc/nginx/snippets/rag-api-proxy-common.conf;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
