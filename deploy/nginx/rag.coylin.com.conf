# Direct DNS deployment. The application uses an HttpOnly admin session.
limit_req_zone $binary_remote_addr zone=rag_login:10m rate=5r/m;

server {
    listen 80;
    listen [::]:80;
    server_name rag.coylin.com;
    root /var/www/rag.coylin.com/current;

    location ^~ /.well-known/acme-challenge/ {
        allow all;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name rag.coylin.com;

    ssl_certificate /etc/letsencrypt/live/rag.coylin.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rag.coylin.com/privkey.pem;

    root /var/www/rag.coylin.com/current;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;

    location ^~ /.well-known/acme-challenge/ {
        allow all;
        try_files $uri =404;
    }

    location = /api/v1/auth/login {
        limit_req zone=rag_login burst=5 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/rag-api-proxy-common.conf;
    }

    location /api/ {
        include /etc/nginx/snippets/rag-api-proxy-common.conf;
    }

    location = /mcp {
        include /etc/nginx/snippets/rag-api-proxy-common.conf;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
