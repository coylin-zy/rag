server {
    listen 80;
    listen [::]:80;
    server_name rag.coylin.com;

    root /var/www/rag.coylin.com/current;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;

    location ^~ /.well-known/acme-challenge/ {
        allow all;
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass https://rag-api.coylin.com;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name rag-api.coylin.com;
        proxy_set_header Host rag-api.coylin.com;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        include /etc/nginx/snippets/rag-proxy-auth.conf;
        proxy_buffering off;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
